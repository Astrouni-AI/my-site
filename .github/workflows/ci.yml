name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: find . -maxdepth 2 -type f | sort

      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f README.md
          test -f LICENSE
          test -f .github/CODEOWNERS
          test -f .github/SECURITY.md

      - name: Check site references
        run: |
          grep -q '<link rel="stylesheet" href="styles.css">' index.html
          grep -q '<title>Moon Notes | 个人博客</title>' index.html
