name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: find . -maxdepth 2 -type f | sort

      - name: Check required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f .github/CODEOWNERS
          test -f .github/SECURITY.md
